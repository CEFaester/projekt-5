<!DOCTYPE html>
<html lang="da">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fysioterapi med høj faglighed</title>
        <link rel="stylesheet" href="style.css">
        <script src="behandling.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400..800&display=swap" rel="stylesheet">
    </head>
<body class="page">

        <!-- Header (Går helt ud til kanten) -->
    <header class="header">
        
        <div class="header__logo">
            <img src="assets/logo.svg" alt="Fysioterapi Logo" class="header__logo-img">
        </div>

        <nav class="header__nav">
            <ul class="header__menu">
                <li class="header__menu-item"><a href="#forside" class="header__menu-link">Behandlinger</a></li>
                <li class="header__menu-item"><a href="#behandlinger" class="header__menu-link">Holdtræning</a></li>
                <li class="header__menu-item"><a href="#priser" class="header__menu-link">Erhvervsaftaler</a></li>
                <li class="header__menu-item"><a href="#om-mig" class="header__menu-link">Priser</a></li>
                <li class="header__menu-item"><a href="#om-mig" class="header__menu-link">Kontakt</a></li>
            </ul>
        </nav>

        <div class="header__contact">
            <a href="tel:+4512345678" class="header__phone">TLF: 60 86 67 70</a>
        </div>

        <button class="header__burger" aria-label="Åbn menu">
            <span class="header__burger-line"></span>
            <span class="header__burger-line"></span>
            <span class="header__burger-line"></span>
        </button>

    </header>
   



    <main>

    <section class="accordion">

      <article class="accordion-item">

        <h2>

          <button
            class="accordion-header"
            aria-expanded="false"
          >
            Hvad er JavaScript?
          </button>

        </h2>

        <div
          class="accordion-content"
          aria-hidden="true"
        >

          <div class="accordion-content-inner">

            <p>
              JavaScript bruges til at gøre websites interaktive.
            </p>

          </div>

        </div>

      </article>



      <article class="accordion-item">

        <h2>

          <button
            class="accordion-header"
            aria-expanded="false"
          >
            Hvad er CSS?
          </button>

        </h2>

        <div
          class="accordion-content"
          aria-hidden="true"
        >

          <div class="accordion-content-inner">

            <p>
              CSS bruges til styling af websites.
            </p>

          </div>

        </div>

      </article>

    </section>

  </main>






        <!-- Footer (Går helt ud til kanten) -->
    <footer class="footer">
        <p class="footer__text">© 2026 Fysioterapien</p>
    </footer>
</body>
</html>
